[project]
name = "dancebuddy"
version = "0.1.0"
description = "An agent that teaches non-humanoid 3D characters to dance along with a human dancer (CS329Z project)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10.20",
    "openai>=1.50",
    "jsonschema>=4.20",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
# Blender as a Python module (~400 MB). Skip it if you have the Blender app
# installed and set BLENDER=/path/to/blender instead.
render = ["bpy>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dancebuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
